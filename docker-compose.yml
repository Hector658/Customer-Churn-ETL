services:
  postgres:
    image: postgres:16
    container_name: churn_postgres
    environment:
        POSTGRES_USER: churn_user
        POSTGRES_PASSWORD: churn_pass
        POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
